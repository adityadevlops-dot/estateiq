<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - EstateIQ</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Auth Page Specific Styles */
    body {
      background: linear-gradient(135deg, var(--color-bg-primary) 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-24);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-48);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--spacing-48);
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-12);
      margin-bottom: var(--spacing-24);
    }

    .auth-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--color-bg-primary);
      font-size: 20px;
    }

    .auth-logo-text {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-heading);
      color: var(--color-text-primary);
    }

    .auth-title {
      font-size: var(--font-size-h3);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-8);
      font-family: var(--font-heading);
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-20);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-8);
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: var(--font-letter-spacing-label);
    }

    .form-input {
      padding: var(--spacing-12) var(--spacing-16);
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      transition: all 0.3s var(--easing);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(200, 169, 110, 0.1);
    }

    .form-input::placeholder {
      color: var(--color-text-muted);
    }

    .form-error {
      font-size: 12px;
      color: #FF6B6B;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    .password-strength {
      font-size: 11px;
      margin-top: var(--spacing-4);
      display: flex;
      align-items: center;
      gap: var(--spacing-8);
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
    }

    .strength-indicator {
      height: 100%;
      width: 0%;
      background: #8B3A3A;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .form-submit {
      padding: var(--spacing-12) var(--spacing-16);
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius-md);
      color: var(--color-bg-primary);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s var(--easing);
      text-transform: uppercase;
      letter-spacing: var(--font-letter-spacing-label);
    }

    .form-submit:hover {
      background: var(--color-accent-dark);
      transform: translateY(-2px);
    }

    .form-submit:active {
      transform: translateY(0);
    }

    .form-submit.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-link {
      text-align: center;
      margin-top: var(--spacing-24);
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .auth-link a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s var(--easing);
    }

    .auth-link a:hover {
      color: var(--color-accent-dark);
    }

    .alert {
      padding: var(--spacing-12) var(--spacing-16);
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: var(--spacing-24);
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.2);
      color: #FF6B6B;
    }

    .alert.success {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.2);
      color: var(--color-success);
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: var(--spacing-32);
      }

      .auth-title {
        font-size: var(--font-size-h4);
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="auth-logo-icon">🏠</div>
          <div class="auth-logo-text">EstateIQ</div>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join thousands of real estate professionals</p>
      </div>

      <div id="alert" class="alert"></div>

      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input 
            type="text" 
            class="form-input" 
            id="fullName"
            placeholder="Your full name"
            autocomplete="name"
          >
          <div class="form-error" id="fullNameError"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Username</label>
          <input 
            type="text" 
            class="form-input" 
            id="username"
            placeholder="Choose a username (3+ chars)"
            autocomplete="username"
            required
          >
          <div class="form-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input 
            type="email" 
            class="form-input" 
            id="email"
            placeholder="your.email@company.com"
            autocomplete="email"
            required
          >
          <div class="form-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            class="form-input" 
            id="password"
            placeholder="Min 8 chars, 1 uppercase, 1 number"
            autocomplete="new-password"
            required
          >
          <div class="password-strength" id="strengthDisplay" style="display: none;">
            <div class="strength-bar">
              <div class="strength-indicator" id="strengthBar"></div>
            </div>
            <span id="strengthText" style="color: var(--color-text-muted);">Weak</span>
          </div>
          <div class="form-error" id="passwordError"></div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Create Account</button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>

      <div class="auth-link" style="margin-top: var(--spacing-16); color: var(--color-text-muted);">
        <a href="index.html" style="color: var(--color-text-secondary);">← Back to Home</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // ========================================================================
    // PASSWORD STRENGTH INDICATOR
    // ========================================================================

    const passwordInput = document.getElementById('password');
    const strengthDisplay = document.getElementById('strengthDisplay');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    passwordInput.addEventListener('input', (e) => {
      const password = e.target.value;
      
      if (!password) {
        strengthDisplay.style.display = 'none';
        return;
      }

      strengthDisplay.style.display = 'flex';

      let strength = 0;
      if (password.length >= 8) strength += 25;
      if (password.length >= 12) strength += 25;
      if (/[A-Z]/.test(password)) strength += 25;
      if (/[0-9]/.test(password)) strength += 25;

      strengthBar.style.width = strength + '%';

      if (strength <= 25) {
        strengthBar.style.background = '#8B3A3A';
        strengthText.textContent = 'Weak';
        strengthText.style.color = '#FF6B6B';
      } else if (strength <= 50) {
        strengthBar.style.background = '#D4A574';
        strengthText.textContent = 'Fair';
        strengthText.style.color = '#FFD700';
      } else if (strength <= 75) {
        strengthBar.style.background = '#C8A96E';
        strengthText.textContent = 'Good';
        strengthText.style.color = '#C8A96E';
      } else {
        strengthBar.style.background = '#4CB050';
        strengthText.textContent = 'Strong';
        strengthText.style.color = '#4CB050';
      }
    });

    // ========================================================================
    // SIGNUP FORM HANDLING
    // ========================================================================

    const signupForm = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const fullNameInput = document.getElementById('fullName');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const alert = document.getElementById('alert');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = fullNameInput.value.trim();
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Clear previous errors
      document.getElementById('fullNameError').textContent = '';
      document.getElementById('usernameError').textContent = '';
      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      document.querySelectorAll('.form-error').forEach(el => el.classList.remove('show'));
      alert.classList.remove('show');

      // Validate
      let isValid = true;

      if (!username || username.length < 3) {
        document.getElementById('usernameError').textContent = 'Username must be at least 3 characters';
        document.getElementById('usernameError').classList.add('show');
        isValid = false;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        document.getElementById('emailError').textContent = 'Invalid email format';
        document.getElementById('emailError').classList.add('show');
        isValid = false;
      }

      if (!password || password.length < 8) {
        document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
        document.getElementById('passwordError').classList.add('show');
        isValid = false;
      } else if (!/[A-Z]/.test(password)) {
        document.getElementById('passwordError').textContent = 'Password must contain at least one uppercase letter';
        document.getElementById('passwordError').classList.add('show');
        isValid = false;
      } else if (!/[0-9]/.test(password)) {
        document.getElementById('passwordError').textContent = 'Password must contain at least one number';
        document.getElementById('passwordError').classList.add('show');
        isValid = false;
      }

      if (!isValid) return;

      // Show loading state
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const response = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            email,
            password,
            full_name: fullName
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        // Save token
        localStorage.setItem('auth_token', data.data.access_token);
        localStorage.setItem('user', JSON.stringify(data.data.user));

        // Show success message
        alert.classList.add('success', 'show');
        alert.textContent = '✓ Account created! Redirecting...';

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        console.error('Signup error:', error);
        alert.classList.add('error', 'show');
        alert.textContent = `✗ ${error.message}`;
      } finally {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });

    // Check if already logged in
    window.addEventListener('load', () => {
      const token = localStorage.getItem('auth_token');
      if (token) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
