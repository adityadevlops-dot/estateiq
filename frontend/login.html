<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EstateIQ</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Auth Page Specific Styles */
    body {
      background: linear-gradient(135deg, var(--color-bg-primary) 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-24);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-48);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--spacing-48);
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-12);
      margin-bottom: var(--spacing-24);
    }

    .auth-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--color-bg-primary);
      font-size: 20px;
    }

    .auth-logo-text {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-heading);
      color: var(--color-text-primary);
    }

    .auth-title {
      font-size: var(--font-size-h3);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-8);
      font-family: var(--font-heading);
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-24);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-8);
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: var(--font-letter-spacing-label);
    }

    .form-input {
      padding: var(--spacing-12) var(--spacing-16);
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      transition: all 0.3s var(--easing);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(200, 169, 110, 0.1);
    }

    .form-input::placeholder {
      color: var(--color-text-muted);
    }

    .form-error {
      font-size: 12px;
      color: #FF6B6B;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    .form-submit {
      padding: var(--spacing-12) var(--spacing-16);
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius-md);
      color: var(--color-bg-primary);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s var(--easing);
      text-transform: uppercase;
      letter-spacing: var(--font-letter-spacing-label);
    }

    .form-submit:hover {
      background: var(--color-accent-dark);
      transform: translateY(-2px);
    }

    .form-submit:active {
      transform: translateY(0);
    }

    .form-submit.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-link {
      text-align: center;
      margin-top: var(--spacing-24);
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .auth-link a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s var(--easing);
    }

    .auth-link a:hover {
      color: var(--color-accent-dark);
    }

    .alert {
      padding: var(--spacing-12) var(--spacing-16);
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: var(--spacing-24);
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.2);
      color: #FF6B6B;
    }

    .alert.success {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.2);
      color: var(--color-success);
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: var(--spacing-32);
      }

      .auth-title {
        font-size: var(--font-size-h4);
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="auth-logo-icon">🏠</div>
          <div class="auth-logo-text">EstateIQ</div>
        </div>
        <h1 class="auth-title">Sign In</h1>
        <p class="auth-subtitle">Welcome back. Let's predict some prices!</p>
      </div>

      <div id="alert" class="alert"></div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input 
            type="text" 
            class="form-input" 
            id="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >
          <div class="form-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            class="form-input" 
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <div class="form-error" id="passwordError"></div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Sign In</button>
      </form>

      <div class="auth-link">
        Don't have an account? <a href="signup.html">Create one here</a>
      </div>

      <div class="auth-link" style="margin-top: var(--spacing-16); color: var(--color-text-muted);">
        <a href="index.html" style="color: var(--color-text-secondary);">← Back to Home</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // ========================================================================
    // LOGIN FORM HANDLING
    // ========================================================================

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const alert = document.getElementById('alert');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      // Clear previous errors
      document.getElementById('usernameError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      document.getElementById('usernameError').classList.remove('show');
      document.getElementById('passwordError').classList.remove('show');
      alert.classList.remove('show');

      // Validate
      let isValid = true;
      if (!username) {
        document.getElementById('usernameError').textContent = 'Username is required';
        document.getElementById('usernameError').classList.add('show');
        isValid = false;
      }
      if (!password) {
        document.getElementById('passwordError').textContent = 'Password is required';
        document.getElementById('passwordError').classList.add('show');
        isValid = false;
      }

      if (!isValid) return;

      // Show loading state
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Save token
        localStorage.setItem('auth_token', data.data.access_token);
        localStorage.setItem('user', JSON.stringify(data.data.user));

        // Show success message
        alert.classList.add('success', 'show');
        alert.textContent = '✓ Login successful! Redirecting...';

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        console.error('Login error:', error);
        alert.classList.add('error', 'show');
        alert.textContent = `✗ ${error.message}`;
      } finally {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Check if already logged in
    window.addEventListener('load', () => {
      const token = localStorage.getItem('auth_token');
      if (token) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
